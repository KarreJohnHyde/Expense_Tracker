AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Backend infrastructure for Expense Tracker
  Configures DynamoDB Single-Table and API Gateway.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64

Resources:
  ExpenseTrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ExpenseTrackerTable
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ExpenseTrackerTable
      Events:
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseTrackerApi
            Path: /{proxy+}
            Method: ANY

  ExpenseTrackerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ExpenseTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  TableName:
    Description: "DynamoDB Table Name"
    Value: !Ref ExpenseTrackerTable
