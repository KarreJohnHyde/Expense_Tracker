name: OCR Pipeline CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  app-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript checks
        run: pnpm exec tsc --noEmit

  worker-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ml.txt
          pip install ruff
      - name: Lint worker
        run: ruff check app tests
      - name: Run extraction unit tests
        run: pytest tests/test_extractors.py

  build-and-push-images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [worker-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./python_worker
          file: ./python_worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/expense-ocr-worker:${{ github.sha }}
      - name: Build and push node API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/expense-ocr-node-api:${{ github.sha }}

  integration-tests:
    runs-on: ubuntu-latest
    needs: [app-quality, worker-quality]
    if: ${{ secrets.OCR_API_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run OCR integration tests
        env:
          OCR_API_BASE_URL: ${{ secrets.OCR_API_BASE_URL }}
        run: node --test tests/integration/ocr.integration.test.mjs

  deploy-aws-lambda:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [app-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: Deploy Lambda with Serverless Framework
        run: |
          npm install -g serverless@3
          serverless deploy --stage prod

  deploy-cloud-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Apply Cloud Run Terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_worker_image: ghcr.io/${{ github.repository_owner }}/expense-ocr-worker:${{ github.sha }}
          TF_VAR_api_image: ghcr.io/${{ github.repository_owner }}/expense-ocr-node-api:${{ github.sha }}
        run: |
          cd infra/gcp
          terraform init
          terraform apply -auto-approve
